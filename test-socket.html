<!DOCTYPE html>
<html>
  <head>
    <title>Test Socket.IO</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
  </head>
  <body>
    <h1>Test Socket.IO Connection</h1>
    <label>JWT <input id="token" size="80" /></label>
    <label>User ID <input id="userId" type="number" /></label>
    <button onclick="connectSocket()">Connect</button>
    <div id="logs"></div>
    <button onclick="testCreate()">Test Create Room</button>

    <script>
      const logs = document.getElementById('logs');

      function log(message) {
        logs.innerHTML += `<p>${new Date().toLocaleTimeString()}: ${message}</p>`;
        console.log(message);
      }

      let socket;

      function connectSocket() {
        socket?.disconnect();
        socket = io('http://localhost:8080', {
          auth: { token: document.getElementById('token').value },
        });

        socket.on('connect', () => {
          log('✅ Connecté ! Socket ID: ' + socket.id);
        });

        socket.on('connect_error', (error) => {
          log('❌ Erreur de connexion: ' + error.message);
        });

        socket.on('disconnect', (reason) => {
          log('🔌 Déconnecté: ' + reason);
        });

        // Écouter les réponses
        socket.on('roomCreated', (data) => {
          log('🎯 Room créée: ' + JSON.stringify(data));
        });

        socket.on('error', (data) => {
          log('⚠️ Erreur: ' + JSON.stringify(data));
        });
      }

      function testCreate() {
        log('📤 Envoi événement create...');
        socket.emit('create', {
          name: 'test-room-html',
          userId: Number(document.getElementById('userId').value),
          category: 'animals',
        });
      }
    </script>
  </body>
</html>
